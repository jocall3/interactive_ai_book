name: Node.js with Webpack

on:
  push:
    branches: [ "master" ]  # Change to "Master" if your branch is capitalized
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Create .env.local with secret
        run: echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env.local

      - name: Install dependencies
        run: npm install

      - name: Install webpack-cli (required by Webpack)
        run: npm install --no-save webpack-cli

      - name: Build with Webpack
        run: npx webpack
